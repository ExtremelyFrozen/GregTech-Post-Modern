site_name: GregTech Post Modern 文档
site_url: https://extremelyfrozen.github.io/GregTech-Post-Modern/

repo_name: GregTech Post Modern
repo_url: https://github.com/ExtremelyFrozen/GregTech-Post-Modern
edit_uri: blob/1.21/docs/content/

docs_dir: content

theme:
  name: material
  language: zh
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    # Palette toggle for dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - content.code.annotate
    - content.action.view

plugins:
  - search
  - awesome-pages

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/bWSWuYvURP
    - icon: material/download
      link: https://github.com/ExtremelyFrozen/GregTech-Post-Modern/releases
      name: 下载 GregTech Post Modern
    - icon: fontawesome/brands/github
      link: https://github.com/ExtremelyFrozen/GregTech-Post-Modern

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - md_in_html
  - pymdownx.betterem
  - pymdownx.caret:
      insert: false
  - pymdownx.tilde:
      delete: false
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
