[versions]
minecraft = "1.21.1"
neoForge = "21.1.216"
loader = "4"
parchment = "2024.11.17" # https://parchmentmc.org/docs/getting-started
shadow = "9.4.1"
spotless = "8.6.0"
modDevGradle = "2.0.141"
lombok = "9.5.0"
kotlin-lombok = "2.1.20"
jetbrains-annotations = "26.1.0"
renderNurse = "0.0.26"
mixin = "0.8.7"

jackson = "2.21.1"
jackson-annotations = "2.21"
zstd = "1.5.7-8"

[libraries]
minecraft               = { module = "com.mojang:minecraft", version.ref = "minecraft" }
neoForge                = { module = "net.neoforged:neoforge", version.ref = "neoForge" }
testframework           = { module = "net.neoforged:testframework", version.ref = "neoForge" }
jetbrains-annotations   = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
jackson-dataformat      = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-cbor", version.ref = "jackson" }
jackson-core            = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind        = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-annotations     = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson-annotations" }
zstd                    = { module = "com.github.luben:zstd-jni", version.ref = "zstd" }
renderNurse             = { module = "net.neoforged:render-nurse", version.ref = "renderNurse" }
mixin                   = { module = "org.spongepowered:mixin", version.ref = "mixin" }

[plugins]
modDevGradle            = { id = "net.neoforged.moddev", version.ref = "modDevGradle" }
shadow                  = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless                = { id = "com.diffplug.spotless", version.ref = "spotless" }
lombok                  = { id = "io.freefair.lombok", version.ref = "lombok" }
kotlin-lombok           = { id = "org.jetbrains.kotlin.plugin.lombok", version.ref = "kotlin-lombok" }
