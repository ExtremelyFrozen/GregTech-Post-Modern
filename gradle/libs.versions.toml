[versions]
minecraft = "1.21.1"
neoForge = "21.1.265"
loader = "4"
parchment = "2024.11.17" # https://parchmentmc.org/docs/getting-started
shadow = "9.6.1"
spotless = "8.11.0"
modDevGradle = "2.0.148"
lombok = "9.8.3"
kotlin = "2.4.21"
jetbrains-annotations = "26.1.0"
jspecify = "1.0.1"
renderNurse = "0.0.26"
mixin = "0.8.7"

zstd = "1.5.7-8"

[libraries]
minecraft               = { module = "com.mojang:minecraft", version.ref = "minecraft" }
neoForge                = { module = "net.neoforged:neoforge", version.ref = "neoForge" }
testframework           = { module = "net.neoforged:testframework", version.ref = "neoForge" }
zstd                    = { module = "com.github.luben:zstd-jni", version.ref = "zstd" }
kotlin-stdlib           = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
renderNurse             = { module = "net.neoforged:render-nurse", version.ref = "renderNurse" }
mixin                   = { module = "org.spongepowered:mixin", version.ref = "mixin" }
jetbrains-annotations   = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
jspecify                = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

[plugins]
modDevGradle            = { id = "net.neoforged.moddev", version.ref = "modDevGradle" }
shadow                  = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless                = { id = "com.diffplug.spotless", version.ref = "spotless" }
lombok                  = { id = "io.freefair.lombok", version.ref = "lombok" }
kotlin-jvm              = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-lombok           = { id = "org.jetbrains.kotlin.plugin.lombok", version.ref = "kotlin" }
